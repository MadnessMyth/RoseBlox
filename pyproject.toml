[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roseblox"
version = "0.2.1"
description = "A native Linux launcher and installation manager for Roblox through Rosemary"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
roseblox = "roseblox.__main__:main"

[tool.setuptools.package-data]
roseblox = ["resources/*.css", "resources/*.svg"]

[tool.setuptools.packages.find]
where = ["src"]
