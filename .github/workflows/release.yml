name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, such as v0.4.1"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1

jobs:
  packages:
    # The AppImage bundles this system's libraries, so it runs on systems at least as new.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 librsvg2-common \
            adwaita-icon-theme libarchive-tools libglib2.0-bin zsync
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          packaging/debian/build-deb.sh dist
          APPIMAGE_EXTRACT_AND_RUN=1 python3 packaging/appimage/build_appimage.py --appimagetool "$PWD/appimagetool"

      - name: Check that the AppImage starts its bundled Python
        run: |
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Roseblox-x86_64.AppImage --activity-watch 2> usage.txt || status=$?
          cat usage.txt
          [ "$status" = 2 ] && grep -q '^Usage: roseblox --activity-watch' usage.txt

      - name: Checksums
        working-directory: dist
        run: sha256sum roseblox_*_all.deb Roseblox-x86_64.AppImage > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/roseblox_*_all.deb
            dist/Roseblox-x86_64.AppImage
            dist/Roseblox-x86_64.AppImage.zsync
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish the release from packaging/RELEASE.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version tag: $TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "No tag $TAG" >&2; exit 1; }
          git show "$TAG:packaging/RELEASE.md" \
            | awk -v heading="## Release notes — $TAG" '$0 == heading {found=1; next} /^## / {if (found) exit} found' \
            > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "packaging/RELEASE.md at $TAG has no \"Release notes — $TAG\" section" >&2
            exit 1
          fi
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          latest=false
          [ "$TAG" = "$newest" ] && latest=true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Roseblox $TAG" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" --verify-tag --title "Roseblox $TAG" --notes-file notes.md --latest="$latest"
          fi
          gh release upload "$TAG" dist/* --clobber
